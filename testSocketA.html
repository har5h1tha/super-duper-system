<!DOCTYPE html>
<html>

<head>
    <title>A Chat</title>
</head>

<body>

    <h2>CollabHub Chat A</h2>
    <div>
        <strong id="chatUser">User</strong>
        <span id="status">Offline</span>
    </div>

    <div id="messages"></div>

    <input id="messageInput" placeholder="Type a message">
    <button id="sendButton">Send</button><br>
    <div id="typingStatus"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhNzY5Zjk1MDI0YzZhMDE1NWRiNmE1OSIsImlhdCI6MTc4NjE2Njg5OCwiZXhwIjoxNzg2NzcxNjk4fQ.fakL4EVzWrGhkt6NUG_uUujJte8SE_UTf2PAqvDhFHA";
        const receiverId = "6a68b0b274d243798df75636";


        let currentUserId;
        const messages = document.getElementById("messages");
        const input = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const status = document.getElementById("status");
        const typingStatus = document.getElementById("typingStatus");


        function displayMessage(message) {
            const div = document.createElement("div");
            if (message.sender === currentUserId) {
                div.textContent = `You: ${message.content}`;
            } else {
                div.textContent = `Them: ${message.content}`;
            }
            messages.appendChild(div);
        }

        async function getCurrentUser() {
            const response = await fetch(
                "http://localhost:3000/api/users/me",
                {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const user = await response.json();
            if (!response.ok) {
                console.error("Failed to get current user:", user);
                return;
            }
            currentUserId = user._id;
            console.log("Current user:", user.username);
        }

        async function loadMessages() {
            const response = await fetch(
                `http://localhost:3000/api/messages/${receiverId}`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                console.error("Failed to load messages:", data);
                return;
            }

            data.forEach((message) => {
                displayMessage(message);
            });
        }

        async function initialize() {
            await getCurrentUser();
            await loadMessages();
        }

        initialize();

        const socket = io("http://localhost:3000", {
            auth: {
                token
            }
        });

        socket.on("receive-message", (message) => {
            console.log("SOCKET MESSAGE RECEIVED:", message);
            displayMessage(message);

            socket.emit("message-delivered", {
                messageId: message._id
            });

            socket.emit("message-read", {
                messageId: message._id
            });
        });

        socket.on("message-delivered", (data) => {
            console.log("Message delivered:", data);
        });

        socket.on("message-read", (data) => {
            console.log("Message read:", data);
        });

        socket.on("online-users", (users) => {
            if (users.includes(receiverId)) {
                status.textContent = "Online";
            } else {
                status.textContent = "Offline";
            }
        });

        socket.on("user-online", (data) => {
            if (data.userId === receiverId) {
                status.textContent = "Online";
            }
        });

        socket.on("user-offline", (data) => {
            if (data.userId === receiverId) {
                status.textContent = "Offline";
            }
        });

        socket.on("user-typing", (data) => {
            if (data.userId === receiverId) {
                typingStatus.textContent = "Typing...";
            }
        });

        socket.on("user-stop-typing", (data) => {
            if (data.userId === receiverId) {
                typingStatus.textContent = "";
            }
        });
        
        sendButton.addEventListener("click", async () => {
            const content = input.value.trim();

            if (!content) return;

            const response = await fetch(
                "http://localhost:3000/api/messages/send",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        receiver: receiverId,
                        content: content
                    })
                }
            );

            const data = await response.json();

            if (response.ok) {
                input.value = "";
            } else {
                console.error(data);
            }
        });

        //TYPING
        let typingTimeout;

        input.addEventListener("input", () => {
            socket.emit("typing", {
                receiverId
            });

            clearTimeout(typingTimeout);

            typingTimeout = setTimeout(() => {
                socket.emit("stop-typing", {
                    receiverId
                });
            }, 1000);
        });

    </script>

</body>

</html>
